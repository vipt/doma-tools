name: Build and publish Eclipse update site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set up Maven 3.8.6 for Tycho 3
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.8.6/apache-maven-3.8.6-bin.tar.gz \
            --output "$RUNNER_TEMP/apache-maven.tar.gz"
          printf '%s  %s\n' \
            'f790857f3b1f90ae8d16281f902c689e4f136ebe584aba45e4b1fa66c80cba826d3e0e52fdd04ed44b4c66f6d3fe3584a057c26dfcac544a60b301e6d0f91c26' \
            "$RUNNER_TEMP/apache-maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/apache-maven.tar.gz" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/apache-maven-3.8.6/bin" >> "$GITHUB_PATH"
      - name: Build plug-in and p2 repository
        run: |
          mvn --version
          mvn --batch-mode --no-transfer-progress verify
      - name: Check generated update site
        run: |
          site_dir=org.seasar.doma.extension.updatesite/target/repository
          test -s "$site_dir/p2.index"
          test -s "$site_dir/content.jar"
          test -s "$site_dir/artifacts.jar"
          test -s "$site_dir/index.html"
          test -d "$site_dir/features"
          test -d "$site_dir/plugins"
      - name: Upload update site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: org.seasar.doma.extension.updatesite/target/repository

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy update site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
