name: Build and publish Eclipse update site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build plug-in and p2 repository
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Check generated update site
        run: |
          site_dir=org.seasar.doma.extension.updatesite/target/repository
          test -s "$site_dir/p2.index"
          test -s "$site_dir/content.jar"
          test -s "$site_dir/artifacts.jar"
          test -s "$site_dir/index.html"
          test -d "$site_dir/features"
          test -d "$site_dir/plugins"
      - name: Upload update site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: org.seasar.doma.extension.updatesite/target/repository

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy update site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
